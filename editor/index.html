<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' library-asset: data: blob:; font-src 'self' data:; media-src 'self' library-asset: data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>TokenLibrary 笔记编辑器</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="editor-toolbar">
    <nav aria-label="编辑模式" class="mode-picker">
      <button type="button" data-mode="edit" aria-pressed="true">排版</button>
      <button type="button" data-mode="source" aria-pressed="false">源码</button>
      <button type="button" data-mode="read" aria-pressed="false">阅读</button>
    </nav>
    <div id="format-tools" role="toolbar" aria-label="文本格式">
      <button type="button" data-command="heading" aria-label="二级标题">H2</button>
      <button type="button" data-command="bold" aria-label="加粗"><b>B</b></button>
      <button type="button" data-command="italic" aria-label="斜体"><i>I</i></button>
      <button type="button" data-command="list" aria-label="无序列表">列表</button>
      <button type="button" id="insert-image">图片</button>
      <button type="button" id="insert-math">公式</button>
      <button type="button" id="insert-diagram">流程图</button>
    </div>
  </header>
  <p id="error" role="alert" hidden></p>
  <main>
    <div id="rich"></div>
    <textarea id="source" aria-label="Markdown 源码" aria-describedby="source-keyboard-help" spellcheck="false" hidden></textarea>
    <article id="preview" aria-label="笔记阅读预览" hidden></article>
  </main>
  <footer><span id="source-keyboard-help" hidden>Tab 缩进；Shift-Tab 向前移焦；Esc 后按 Tab 可离开源码区。</span><span id="status" aria-live="polite">正在准备编辑器…</span><button type="button" id="retry-save" hidden>重试保存</button></footer>
  <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
  <script src="editor.js"></script>
</body>
</html>
